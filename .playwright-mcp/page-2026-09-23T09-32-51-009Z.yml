              - heading "Data and provenance" [level=3] [ref=f8e128]
              - paragraph [ref=f8e129]: NOAA GEFSv12 reforecast provides historical forecast fields. IMD gridded rainfall is the observation reference. The canonical rainfall target is a 49×49, 0.25° grid with explicit validity masks. The district geometry is the documented geoBoundaries IND ADM2 2021 source.
            - generic [ref=f8e130]:
              - heading "What the evidence says" [level=3] [ref=f8e133]
              - paragraph [ref=f8e134]: Global XGBoost has the lowest deterministic RMSE among the frozen model ladder. Soft regime routing edges hard routing but does not beat Global ML. Raw GEFS retains stronger deterministic heavy-event and spatial FSS skill. The UI does not recast those outcomes.
            - generic [ref=f8e135]:
              - heading "Limits of readiness" [level=3] [ref=f8e138]
              - paragraph [ref=f8e139]: This is a historical scientific prototype, not live forecasting. Regime labels are forecast-only pseudo-labels rather than independently observed weather truth. Rare Very Heavy events leave high-probability calibration bins sparse. District outputs cover the validated domain only.
