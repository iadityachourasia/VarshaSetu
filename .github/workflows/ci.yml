name: CI

# Fast, deterministic checks on every push to master and every pull request.
# Not covered here (run locally, see docs/120): the Playwright end-to-end suite (needs the full backend with data and a browser)
# and the Phase 4 freeze tests that import the gitignored local experiment code.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must stay identical to the Dockerfile (a backend test enforces this).
  DATA_BUNDLE_URL: https://github.com/iadityachourasia/VarshaSetu/releases/download/serving-data-v1/varshasetu-serving-data-v1.tar.gz
  DATA_BUNDLE_SHA256: f5904aa9c8b1b96fb124b96396e854e3df840daa85efe05c20031e55fa22b262

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned production requirements
        run: pip install -r backend/requirements.txt

      - name: Serving-data bundle (cached, checksum-verified)
        id: bundle
        uses: actions/cache@v4
        with:
          path: .bundle/bundle.tar.gz
          key: serving-data-v1-${{ env.DATA_BUNDLE_SHA256 }}

      - name: Download the bundle
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          mkdir -p .bundle
          curl -fL --retry 8 --retry-delay 5 --retry-all-errors -C - "$DATA_BUNDLE_URL" -o .bundle/bundle.tar.gz

      - name: Verify and extract the bundle
        run: |
          echo "${DATA_BUNDLE_SHA256}  .bundle/bundle.tar.gz" | sha256sum -c -
          tar --no-same-owner --no-same-permissions -xzf .bundle/bundle.tar.gz -C .

      - name: Backend tests
        # -rs prints every skipped test with its reason, so nothing is skipped silently.
        run: python -m pytest backend/tests -q -rs -p no:cacheprovider

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Static check only: it does not build the image or download the 200 MB data bundle.
      - run: docker build --check .
